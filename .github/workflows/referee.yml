name: Bantr Automated Referee

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch: 

jobs:
  settle-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Unified Referee for Duels and Rumbles
        run: |
          curl -k -L -f -sS -X GET "https://www.bantr.lol/api/cron/settle-rumbles" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"