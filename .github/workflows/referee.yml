name: Bantr Automated Referee

on:
  schedule:
    - cron: '*/15 * * * *' # Upgraded to every 15 minutes for faster payouts!
  workflow_dispatch: # Adds a button in GitHub to manually trigger it for testing

jobs:
  settle-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Unified Referee for Duels and Rumbles
        run: |
          curl -X GET "https://bantr.lol/api/cron/settle-rumbles" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"