name: Hourly Bantr Tasks

on:
  schedule:
    - cron: '0 * * * *' # Runs at minute 0 of every hour
  workflow_dispatch:    # 🔥 Lets you click a button in GitHub to test it instantly!

jobs:
  run-hourly-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hourly Master Cron
        run: |
          curl -f -sS -X GET "https://bantr.lol/api/cron/hourly" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"









