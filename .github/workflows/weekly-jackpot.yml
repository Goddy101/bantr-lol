name: Weekly Bantr Jackpot

on:
  schedule:
    - cron: '59 22 * * 0' # Runs at 22:59 every Sunday
  workflow_dispatch:    # 🔥 Added so you can test the jackpot payout manually!

jobs:
  run-jackpot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Jackpot
        run: |
          curl -k -L -f -sS -X GET "https://bantr.lol/api/cron/weekly-jackpot" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"